<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Network Monitor</title>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --border: #21262d;
  --border2: #30363d;
  --text: #c9d1d9;
  --text-dim: #6e7681;
  --text-bright: #f0f6fc;
  --blue: #388bfd;
  --blue-dim: #1f6feb;
  --red: #f85149;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 32px;
  width: 100%;
  max-width: 360px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
input[type=password] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
}
input[type=password]:focus { border-color: var(--blue); }
button {
  width: 100%;
  margin-top: 16px;
  background: var(--blue-dim);
  border: none;
  border-radius: 6px;
  color: #fff;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: var(--blue); }
button:disabled { opacity: 0.6; cursor: default; }
.error {
  display: none;
  margin-top: 12px;
  color: var(--red);
  font-size: 13px;
}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo"><span>&#127760;</span> Network Monitor</div>
  <div class="sub">Enter the password to access the dashboard.</div>
  <form id="login-form">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" autofocus>
    <button id="login-btn" type="submit">Sign in</button>
    <div id="login-error" class="error"></div>
  </form>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true;
  err.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    if (res.ok) {
      window.location.href = '/';
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || 'Login failed';
    err.style.display = 'block';
  } catch {
    err.textContent = 'Could not reach the server';
    err.style.display = 'block';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
